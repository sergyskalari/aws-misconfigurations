id: iam-credentials-expiring-soon
name: Credencial que caduca en menos de 15 días
description: >
  Credenciales de usuarios IAM que caducan dentro de warning_days días (15 por
  defecto), para avisar de que hay que cambiarlas. La contraseña caduca en la fecha
  password_next_rotation del informe de credenciales, que depende de la política de
  contraseñas de la cuenta; si la cuenta no hace caducar contraseñas, no se revisa.
  AWS no hace caducar las access keys: se consideran caducadas al cumplir max_age_days
  desde su última rotación (las desactivadas no se revisan). Las credenciales ya
  caducadas no se incluyen: las keys las reporta iam-credentials-older-than-one-year.
  Se incluye la cuenta root, pero solo sus access keys. Aviso preventivo, no una
  vulnerabilidad. Se basa en el informe de credenciales de IAM, que AWS reutiliza
  hasta 4 horas.
risk: low

# Regla con código propio (ver checks.py). IAM es global: ignora --region.
service: iam
check: iam_credentials_expiring_soon

# warning_days: se avisa si faltan menos días que este margen.
# max_age_days: antigüedad a la que caduca una access key. Mantenlo igual que en iam-credentials-older-than-one-year.
# El nombre de la regla menciona los 15 días por defecto: si cambias warning_days, actualiza también 'name'.
# El resto: espera máxima y pausa mientras IAM genera el informe de credenciales.
params:
  warning_days: 15
  max_age_days: 365
  report_timeout_seconds: 30
  report_poll_interval_seconds: 2

columns:
  UserName: UserName
  Credential: Credential
  ExpiresOn: ExpiresOn
  DaysLeft: DaysLeft
