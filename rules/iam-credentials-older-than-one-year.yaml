id: iam-credentials-older-than-one-year
name: Credencial sin rotar en más de 365 días
description: >
  Contraseñas de consola y access keys activas de usuarios IAM que no se han
  cambiado en más de max_age_days días (365 por defecto). Una credencial sin rotar
  incumple la política de claves y es más probable que se haya filtrado sin que
  nadie lo sepa. Una contraseña nunca cambiada cuenta desde la creación del usuario.
  Las keys desactivadas no se revisan. Se incluye la cuenta root, pero solo sus
  access keys: el informe no da la fecha de cambio de su contraseña. Cada credencial
  antigua es una fila. Se basa en el informe de credenciales de IAM, que AWS reutiliza
  hasta 4 horas.
risk: mid

# Regla con código propio (ver checks.py). IAM es global: ignora --region.
service: iam
check: iam_credentials_older_than

# max_age_days: antigüedad máxima permitida; se informa de las credenciales con MÁS días.
# El nombre de la regla menciona los 365 días por defecto: si cambias el umbral, actualiza también 'name'.
# El resto: espera máxima y pausa mientras IAM genera el informe de credenciales.
params:
  max_age_days: 365
  report_timeout_seconds: 30
  report_poll_interval_seconds: 2

columns:
  UserName: UserName
  Credential: Credential
  LastRotated: LastRotated
  AgeDays: AgeDays
